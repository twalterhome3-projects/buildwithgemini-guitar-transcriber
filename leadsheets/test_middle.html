<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Middle - Lead Sheet</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; border-radius: 16px; padding: 2.5rem; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .header { border-bottom: 2px solid #334155; padding-bottom: 1.5rem; margin-bottom: 2rem; }
    h1 { font-size: 2.25rem; font-weight: 800; color: #38bdf8; margin: 0 0 0.5rem 0; }
    .meta-bar { display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.95rem; color: #94a3b8; }
    .meta-item { background: #0f172a; padding: 0.4rem 0.8rem; border-radius: 8px; border: 1px solid #334155; }
    .section { margin-bottom: 2rem; background: #0f172a; padding: 1.5rem; border-radius: 12px; border: 1px solid #334155; }
    .badge { display: inline-block; padding: 0.35rem 0.85rem; border-radius: 9999px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; margin-bottom: 1rem; }
    .badge-intro { background: rgba(139, 92, 246, 0.2); color: #c084fc; border: 1px solid #8b5cf6; }
    .badge-verse { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid #3b82f6; }
    .badge-chorus { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid #ec4899; }
    .lyric-line { display: flex; flex-wrap: wrap; margin-bottom: 1rem; line-height: 1.2; }
    .chord-word-pair { display: inline-flex; flex-direction: column; margin-right: 0.4rem; align-items: flex-start; }
    .chord { font-weight: 800; color: #f43f5e; font-size: 1rem; min-height: 1.2rem; }
    .word { font-size: 1.15rem; color: #f1f5f9; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>The Middle</h1>
      <div class="meta-bar">
        <div class="meta-item"><strong>Artist:</strong> Jimmy Eat World</div>
        <div class="meta-item"><strong>Key:</strong> D Major</div>
        <div class="meta-item"><strong>Tuning:</strong> Drop D</div>
        <div class="meta-item"><strong>Chords:</strong> D5, A5, G5</div>
      </div>
    </div>
    
    <div class="section">
      <span class="badge badge-verse">Verse 1</span>
      <div class="lyric-line">
        <div class="chord-word-pair"><span class="chord">D5</span><span class="word">Hey!</span></div>
      </div>
      <div class="lyric-line">
        <div class="chord-word-pair"><span class="chord">A5</span><span class="word">Don't</span></div>
        <div class="chord-word-pair"><span class="chord"></span><span class="word">write</span></div>
        <div class="chord-word-pair"><span class="chord"></span><span class="word">yourself</span></div>
        <div class="chord-word-pair"><span class="chord">G5</span><span class="word">off</span></div>
        <div class="chord-word-pair"><span class="chord"></span><span class="word">yet</span></div>
      </div>
    </div>

    <div class="section">
      <span class="badge badge-chorus">Chorus</span>
      <div class="lyric-line">
        <div class="chord-word-pair"><span class="chord">D5</span><span class="word">Just</span></div>
        <div class="chord-word-pair"><span class="chord"></span><span class="word">take</span></div>
        <div class="chord-word-pair"><span class="chord">A5</span><span class="word">some</span></div>
        <div class="chord-word-pair"><span class="chord"></span><span class="word">time</span></div>
        <div class="chord-word-pair"><span class="chord">G5</span><span class="word">little</span></div>
        <div class="chord-word-pair"><span class="chord"></span><span class="word">girl</span></div>
      </div>
    </div>
  </div>
</body>
</html>
