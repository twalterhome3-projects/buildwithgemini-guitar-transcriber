<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guitar Transcriber Agent</title>
<!-- Material Symbols & Marked.js for Markdown rendering -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --accent: #6366f1;
    --accent-hover: #4f46e5;
    --bg: #0f172a;
    --card-bg: #1e293b;
    --border: #334155;
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    background: #1e293b;
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 {
    margin: 0;
    font-size: 1.25rem;
    font-weight: 700;
    color: #38bdf8;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .tag {
    background: rgba(99, 102, 241, 0.2);
    color: #a5b4fc;
    border: 1px solid #6366f1;
    padding: 0.25rem 0.6rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem;
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
  }
  .msg { margin: 1rem 0; }
  .msg.user { text-align: right; }
  .bubble {
    display: inline-block;
    padding: 0.85rem 1.15rem;
    border-radius: 14px;
    background: #1e293b;
    border: 1px solid var(--border);
    text-align: left;
    max-width: 85%;
    line-height: 1.55;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
  }
  .msg.user .bubble {
    background: var(--accent);
    color: #ffffff;
    border: none;
    white-space: pre-wrap;
  }
  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { background: transparent; border: none; padding: 0; max-width: 100%; white-space: normal; }

  /* --- Progress Bar Styles --- */
  .progress-widget {
    min-width: 320px;
    max-width: 100%;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    padding: 0.85rem 1rem;
    margin: 0.25rem 0;
  }
  .progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: #38bdf8;
    margin-bottom: 0.5rem;
  }
  .progress-track {
    height: 8px;
    background: #1e293b;
    border-radius: 9999px;
    overflow: hidden;
    position: relative;
    border: 1px solid #334155;
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #6366f1, #38bdf8, #818cf8);
    border-radius: 9999px;
    transition: width 0.4s ease-in-out;
    box-shadow: 0 0 12px rgba(56, 189, 248, 0.6);
  }

  /* --- Markdown Body Styling --- */
  .markdown-body {
    line-height: 1.6;
    font-size: 0.98rem;
    color: #f8fafc;
  }
  .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
    margin-top: 0.85rem;
    margin-bottom: 0.4rem;
    color: #38bdf8;
    font-weight: 700;
  }
  .markdown-body h1 { font-size: 1.35rem; border-bottom: 1px solid #334155; padding-bottom: 0.3rem; }
  .markdown-body h2 { font-size: 1.2rem; }
  .markdown-body h3 { font-size: 1.08rem; color: #818cf8; }
  .markdown-body p { margin: 0.4rem 0; }
  .markdown-body ul, .markdown-body ol { padding-left: 1.4rem; margin: 0.4rem 0; }
  .markdown-body li { margin: 0.2rem 0; }
  .markdown-body strong { color: #ffffff; font-weight: 700; }
  .markdown-body code {
    background: #0f172a;
    padding: 0.15rem 0.4rem;
    border-radius: 5px;
    font-family: monospace;
    font-size: 0.9rem;
    color: #f43f5e;
    border: 1px solid #334155;
  }
  .markdown-body pre {
    background: #0f172a;
    padding: 0.85rem;
    border-radius: 8px;
    overflow-x: auto;
    border: 1px solid #334155;
  }
  .markdown-body pre code { background: none; padding: 0; border: none; color: #f1f5f9; }
  .markdown-body a { color: #38bdf8; text-decoration: underline; word-break: break-all; }
  .markdown-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.85rem 0;
  }
  .markdown-body th, .markdown-body td {
    border: 1px solid #334155;
    padding: 0.5rem 0.75rem;
    text-align: left;
  }
  .markdown-body th { background: #0f172a; color: #38bdf8; }

  form {
    display: flex;
    flex-direction: column;
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: #1e293b;
  }
  .controls-panel {
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
  }
  .file-toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
    margin-bottom: 0.75rem;
  }
  .folder-label {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.85rem;
    font-weight: 600;
    color: #38bdf8;
    background: rgba(56, 189, 248, 0.1);
    padding: 0.4rem 0.75rem;
    border-radius: 8px;
    border: 1px solid rgba(56, 189, 248, 0.3);
  }
  select.recording-select {
    padding: 0.5rem 0.85rem;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 8px;
    color: #f8fafc;
    font-size: 0.85rem;
    font-weight: 500;
    outline: none;
    cursor: pointer;
    min-width: 280px;
    max-width: 100%;
    transition: all 0.2s;
  }
  select.recording-select:hover, select.recording-select:focus {
    border-color: #6366f1;
  }
  .btn-file {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.85rem;
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 8px;
    color: #e2e8f0;
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-file:hover {
    background: #334155;
    border-color: #38bdf8;
    color: #38bdf8;
  }
  .selected-file-badge {
    display: none;
    align-items: center;
    gap: 0.4rem;
    background: rgba(99, 102, 241, 0.2);
    color: #a5b4fc;
    border: 1px solid #6366f1;
    padding: 0.35rem 0.75rem;
    border-radius: 8px;
    font-size: 0.85rem;
    font-weight: 600;
  }

  .input-row {
    display: flex;
    gap: 0.6rem;
  }
  input[type="text"] {
    flex: 1;
    padding: 0.85rem 1rem;
    background: #0f172a;
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: var(--accent);
  }
  button[type="submit"] {
    padding: 0.85rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.2s;
  }
  button[type="submit"]:hover {
    background: var(--accent-hover);
  }

  /* --- A2UI component styles --- */
  .a2card { border:1px solid var(--border); border-radius:12px; padding:1rem; background:#1e293b; box-shadow:0 4px 6px -1px rgba(0,0,0,0.3); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.4rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.4; color: var(--text); }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color:#38bdf8; }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:#818cf8; }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-muted); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.4rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:8px; display:block; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1><span class="material-symbols-outlined" style="font-size:1.6rem; color:#38bdf8;">graphic_eq</span> Guitar Transcriber Agent</h1>
  <span class="tag">A2A Protocol</span>
</header>
<div id="log"></div>

<form id="form">
  <div class="controls-panel">
    <div class="file-toolbar">
      <div class="folder-label">
        <span class="material-symbols-outlined" style="font-size:1.1rem;">folder_open</span>
        <span>/config/Downloads/recordings</span>
      </div>

      <select id="recordingSelect" class="recording-select">
        <option value="">-- Choose MP3 from recordings folder --</option>
      </select>

      <label for="fileInput" class="btn-file">
        <span class="material-symbols-outlined" style="font-size:1.1rem; color:#38bdf8;">upload_file</span> Browse...
      </label>
      <input type="file" id="fileInput" accept=".mp3,audio/mp3,audio/*" style="display:none">
      
      <div id="selectedFileBadge" class="selected-file-badge">
        <span id="selectedFileName"></span>
        <span id="clearFile" style="cursor:pointer; margin-left:0.3rem;">✕</span>
      </div>
    </div>
    
    <div class="input-row">
      <input id="input" placeholder="Select an MP3 above or type a message to transcribe..." autocomplete="off" autofocus>
      <button type="submit">Send</button>
    </div>
  </div>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const fileInput = document.getElementById("fileInput");
const recordingSelect = document.getElementById("recordingSelect");
const selectedFileBadge = document.getElementById("selectedFileBadge");
const selectedFileName = document.getElementById("selectedFileName");
const clearFile = document.getElementById("clearFile");

const RECORDINGS_DIR = "/config/Downloads/recordings";

// Markdown rendering helper with fallback
function renderMarkdown(str) {
  if (window.marked && typeof window.marked.parse === 'function') {
    return window.marked.parse(str);
  }
  let html = str
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/^### (.*$)/gim, '<h3>$1</h3>')
    .replace(/^## (.*$)/gim, '<h2>$1</h2>')
    .replace(/^# (.*$)/gim, '<h1>$1</h1>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/^\- (.*$)/gim, '<li>$1</li>');
  return html.split('\n\n').map(p => `<p>${p.replace(/\n/g, '<br>')}</p>`).join('');
}

// Progress Bar Controller
function createProgressWidget(b) {
  const widget = document.createElement("div");
  widget.className = "progress-widget";
  widget.innerHTML = `
    <div class="progress-header">
      <span id="pStage">🎵 Loading audio file & analyzing waveform...</span>
      <span id="pPercent">15%</span>
    </div>
    <div class="progress-track">
      <div id="pFill" class="progress-fill" style="width: 15%;"></div>
    </div>
  `;
  b.appendChild(widget);

  const stages = [
    { p: 15, text: "🎵 Loading audio file & analyzing waveform..." },
    { p: 35, text: "🎧 Extracting guitar chords & key signature..." },
    { p: 60, text: "📝 Aligning lyrics with chord progression..." },
    { p: 80, text: "📄 Generating HTML lead sheet & updating songbook..." },
    { p: 95, text: "⚡ Finalizing response..." }
  ];

  let step = 0;
  const timer = setInterval(() => {
    if (step < stages.length - 1) {
      step++;
      const s = stages[step];
      const pStage = widget.querySelector("#pStage");
      const pPercent = widget.querySelector("#pPercent");
      const pFill = widget.querySelector("#pFill");
      if (pStage) pStage.textContent = s.text;
      if (pPercent) pPercent.textContent = s.p + "%";
      if (pFill) pFill.style.width = s.p + "%";
    }
  }, 3500);

  return {
    finish: () => {
      clearInterval(timer);
      const pFill = widget.querySelector("#pFill");
      const pPercent = widget.querySelector("#pPercent");
      const pStage = widget.querySelector("#pStage");
      if (pFill) pFill.style.width = "100%";
      if (pPercent) pPercent.textContent = "100%";
      if (pStage) pStage.textContent = "✅ Transcription complete!";
    },
    stop: () => clearInterval(timer)
  };
}

// Fetch available MP3 recordings from /config/Downloads/recordings
async function loadRecordings() {
  try {
    const res = await fetch("/api/recordings");
    const data = await res.json();
    if (data.recordings && data.recordings.length) {
      recordingSelect.innerHTML = '<option value="">-- Select an MP3 recording from folder --</option>';
      data.recordings.forEach(file => {
        const opt = document.createElement("option");
        opt.value = `${RECORDINGS_DIR}/${file}`;
        opt.textContent = `🎵 ${file}`;
        recordingSelect.appendChild(opt);
      });
    }
  } catch (err) {
    console.error("Failed to load recordings list:", err);
  }
}
loadRecordings();

recordingSelect.addEventListener("change", (e) => {
  const fullPath = e.target.value;
  if (fullPath) {
    const fileName = fullPath.split("/").pop();
    selectedFileName.textContent = `🎵 ${fileName}`;
    selectedFileBadge.style.display = "inline-flex";
    input.value = `Please transcribe the audio file at ${fullPath}`;
  }
});

fileInput.addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (file) {
    const fullPath = `${RECORDINGS_DIR}/${file.name}`;
    selectedFileName.textContent = `🎵 ${file.name}`;
    selectedFileBadge.style.display = "inline-flex";
    input.value = `Please transcribe the audio file at ${fullPath}`;
  }
});

clearFile.addEventListener("click", () => {
  fileInput.value = "";
  recordingSelect.value = "";
  selectedFileBadge.style.display = "none";
  selectedFileName.textContent = "";
  input.value = "";
});

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const b = el("div", "bubble");
  m.appendChild(b); log.appendChild(m); log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n\n").trim();
  if (textStr) {
    const mdDiv = el("div", "markdown-body");
    mdDiv.style.marginTop = "0.75rem";
    mdDiv.innerHTML = renderMarkdown(textStr);
    b.appendChild(mdDiv);
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!textStr && !a2ui.length) {
    const errDiv = el("div", "markdown-body", "(The agent returned an empty response.)");
    b.appendChild(errDiv);
  }
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  fileInput.value = "";
  recordingSelect.value = "";
  selectedFileBadge.style.display = "none";
  selectedFileName.textContent = "";

  const b = bubble("agent");
  const progress = createProgressWidget(b);

  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    
    progress.finish();
    setTimeout(() => {
      renderReply(b, data.parts || []);
    }, 400);
  } catch (e) {
    progress.stop();
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
